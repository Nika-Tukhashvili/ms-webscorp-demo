<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version 2 — themed embed (CSS variables)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: #1b2a4a; max-width: 60ch; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; }
    code { background: #f2f4f9; border-radius: 4px; padding: .15em .4em; font-size: .9em; }
  </style>
</head>
<body>
  <h1>Version 2 — themed embed</h1>
  <p>Same minimal embed as version 1, plus <strong>one CSS block</strong>.
     The widget is styled with ordinary CSS custom properties — change any
     value below and the widget follows. Your front-end team owns the look
     entirely; no rebuild, no configuration on our side.</p>

  <!-- ═══ Making Science Assistant — themed embed (version 2) ═══ -->
  <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">

  <!-- Theming: plain CSS variables — edit freely -->
  <style>
    chat-messenger {
      /* accent color: send button, focus states, user message bubble */
      --chat-messenger-color--primary: #f0076f;
      --chat-messenger-color--on-primary: #ffffff;
      --chat-messenger-color--outline-active: #f0076f;
      /* links inside answers */
      --chat-messenger-color--link: #0d1b3d;
      /* font — inherit the site's stack */
      --chat-messenger-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* title bar */
      --chat-messenger-internal-primary-color: #f0076f;
      --chat-messenger-internal-titlebar-background: #0d1b3d;
      --chat-messenger-internal-titlebar-background-color: #0d1b3d;
      --chat-messenger-internal-titlebar-font-color: #ffffff;
      --chat-messenger-internal-titlebar-icon-font-color: #ffffff;
      --chat-messenger-internal-titlebar-button-color: #ffffff;
      --chat-messenger-internal-titlebar-button-color-hover: #f0076f;
      /* launcher bubble */
      --chat-messenger-internal-chat-bubble-background: #f0076f;
      --chat-messenger-internal-chat-bubble-background-color: #f0076f;
      --chat-messenger-internal-chat-bubble-icon-color: #ffffff;
    }
  </style>

  <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/109044558918/locations/eu/apps/6e6b11a6-c0e5-43b3-813a-28f21963fbcb/deployments/c881ca00-3252-4443-9356-76061fa75a4a",
          tokenBroker: { enableTokenBroker: true, enableRecaptcha: false }
        }),
      );
    });
  </script>
  <chat-messenger url-allowlist="*" render-mode="slide-in">
    <chat-messenger-chat-bubble></chat-messenger-chat-bubble>
    <chat-messenger-container chat-title="Making Science Assistant" chat-title-icon="ms-logo.png" enable-audio-input>
    </chat-messenger-container>
  </chat-messenger>
  <!-- ═══ end themed embed ═══ -->
</body>
</html>
